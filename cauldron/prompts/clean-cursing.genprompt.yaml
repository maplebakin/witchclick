title: Clean Cursing Ritual
goal: |
  Draft a PostSpec v2 ritual for returning disruptive energy to its origin without collateral damage.
context:
  - Audience is secular witches seeking focused, gentle banishment and energetic release.
  - Emphasize grounding, naming, and gentle, intentional unbinding rather than revenge.
requirements:
  - Provide 4-5 outline items with stable IDs.
  - Include stage-by-stage ritual instructions and aftercare guidance.
  - Integrate one genuinely helpful resource recommendation.
notes:
  - Maintain a tone of confident, compassionate boundary-setting.
  - Mention mirrored shields or reflective visualization.
safeguards:
  - Explicitly frame all "curses," "banishment," and "unbinding" as metaphorical, energetic, or psychological practices.
  - Emphasize that rituals do not involve causing physical, emotional, or spiritual harm to others or self.
  - Reinforce themes of energetic hygiene, boundary-setting, and personal empowerment.